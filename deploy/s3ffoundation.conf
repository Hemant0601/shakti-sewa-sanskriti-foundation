# Initial HTTP-only config (before SSL cert is obtained)
# Certbot will modify this to add SSL automatically

server {
    listen 80;
    listen [::]:80;
    server_name s3ffoundation.com www.s3ffoundation.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (enabled after SSL setup)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Temporary: serve directly until SSL is set up
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
